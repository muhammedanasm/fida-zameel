<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service Suspended | Maintenance</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      body {
        background-color: #050505;
        color: #ffffff;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: hidden;
      }

      /* Subtle background glow */
      .background-glow {
        position: absolute;
        width: 400px;
        height: 400px;
        background: radial-gradient(
          circle,
          rgba(255, 59, 48, 0.15) 0%,
          rgba(0, 0, 0, 0) 70%
        );
        z-index: 1;
      }

      .container {
        position: relative;
        z-index: 2;
        padding: 40px;
        max-width: 500px;
        border: 1px solid #1a1a1a;
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(10px);
        border-radius: 24px;
      }

      .icon {
        font-size: 48px;
        margin-bottom: 20px;
        display: inline-block;
        filter: drop-shadow(0 0 10px rgba(255, 59, 48, 0.5));
      }

      h1 {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 16px;
        color: #ff3b30; /* Warning Red */
      }

      p {
        font-size: 16px;
        line-height: 1.6;
        color: #888;
        margin-bottom: 32px;
      }

      .contact-btn {
        display: inline-block;
        padding: 14px 32px;
        background-color: #ffffff;
        color: #000000;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        border-radius: 12px;
        transition: all 0.3s ease;
      }

      .contact-btn:hover {
        transform: translateY(-2px);
        background-color: #ff3b30;
        color: #fff;
        box-shadow: 0 10px 20px rgba(255, 59, 48, 0.2);
      }

      .status-tag {
        margin-top: 24px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #444;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="background-glow"></div>

    <div class="container">
      <div class="icon">⚠️</div>
      <h1>Service Suspended</h1>
      <p>
        Access to this website has been temporarily suspended due to
        administrative reasons or an outstanding balance. Please contact the
        developer to restore services.
      </p>

      <a href="https://wa.me/919645016304" class="contact-btn"
        >CONTACT DEVELOPER</a
      >

      <span class="status-tag">Error Code: PENDING_SETTLEMENT</span>
    </div>
  </body>
</html>
